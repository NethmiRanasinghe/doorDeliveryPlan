openapi: 3.1.0
info:
  title: PizzaShackAPI
  description: |
    This is a RESTFul API for Pizza Shack online pizza delivery store.
  contact:
    name: John Doe
    url: http://www.pizzashack.com
    email: architecture@pizzashack.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0

servers:
  - url: https://localhost:9443/am/sample/pizzashack/v1/api
    description: Production API server
    x-internal: false

security:
  - default: []

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pizzaType:
          type: string
        quantity:
          type: integer
          format: int32
        price:
          type: number
          format: float
      required:
        - id
        - pizzaType
        - quantity
        - price

paths: {}